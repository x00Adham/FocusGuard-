{% extends 'layout.html' %}

{% block content %}
<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-primary mb-2">Focus Guard</h1>
        <p class="text-gray-500">Sign in to your portal</p>
    </div>
    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm text-center font-medium">
        {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="/auth/login" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" id="email" name="email" required 
                   class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" required 
                   class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary">
        </div>

        <button type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
